<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>評分系統</title>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      padding: 30px;
      color: #333;
    }

    .section {
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .sub-title {
      font-size: 16px;
      margin-bottom: 8px;
    }

    table {
      border-collapse: collapse;
      text-align: center;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #000;
      padding: 10px 14px;
      min-width: 45px;
      height: 40px;
      vertical-align: middle;
    }

    th {
      font-size: 18px;
      font-weight: normal;
    }

    .option-cell {
      cursor: pointer;
      user-select: none;
    }

    .option-cell:hover {
      background-color: #f7f7f7;
    }

    input[type="radio"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
      margin: 0;
    }

    .score-title {
      font-size: 18px;
    }

    .score-cell {
      min-width: 80px;
      font-size: 20px;
      font-weight: bold;
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <!-- 關卡數量區塊 -->
  <div class="section">
    <div class="section-title">關卡數量(16 分)：</div>
    <table>
      <thead>
        <tr>
          <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th>
          <th class="score-title">得分</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="option-cell"><input type="radio" name="stages" value="1"></td>
          <td class="option-cell"><input type="radio" name="stages" value="2"></td>
          <td class="option-cell"><input type="radio" name="stages" value="3"></td>
          <td class="option-cell"><input type="radio" name="stages" value="4"></td>
          <td class="option-cell"><input type="radio" name="stages" value="5"></td>
          <td class="option-cell"><input type="radio" name="stages" value="6"></td>
          <td class="option-cell"><input type="radio" name="stages" value="7"></td>
          <td class="option-cell"><input type="radio" name="stages" value="8" checked></td>
          <td id="stage-score" class="score-cell">16</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 流暢度區塊 -->
  <div class="section">
    <div class="section-title">流暢度(20 分)：</div>
    <div class="sub-title">手動或掉落次數</div>
    <table>
      <thead>
        <tr>
          <th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
          <th class="score-title">得分</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="option-cell"><input type="radio" name="fluency" value="0" checked></td>
          <td class="option-cell"><input type="radio" name="fluency" value="1"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="2"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="3"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="4"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="5"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="6"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="7"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="8"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="9"></td>
          <td class="option-cell"><input type="radio" name="fluency" value="10"></td>
          <td id="fluency-score" class="score-cell">20</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
